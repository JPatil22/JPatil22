<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Jay Patil — Full-Stack Developer & AI Systems Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#0d1b3a"/>
      <stop offset="100%" stop-color="#071a2e"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#1e6fe0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e6fe0"/>
      <stop offset="100%" stop-color="#0a3a7a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>

  <!-- waves -->
  <path d="M0,170 C200,120 400,220 600,170 C800,120 1000,220 1200,170 L1200,240 L0,240 Z" fill="url(#wave2)" opacity="0.55"/>
  <path d="M0,195 C220,150 420,245 640,195 C860,150 1040,240 1200,200 L1200,240 L0,240 Z" fill="url(#wave1)" opacity="0.85"/>

  <!-- text -->
  <text x="600" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="1">Jay Patil</text>
  <text x="600" y="150" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="20" font-weight="500" fill="#36BCF7">Full-Stack Developer &amp; AI Systems Engineer</text>
</svg>
